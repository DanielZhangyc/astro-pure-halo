name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ""
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Astro
        run: pnpm check
      - name: Build Halo package
        run: pnpm build
      - name: Verify package
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "dist/astro-pure-halo-${version}.zip"

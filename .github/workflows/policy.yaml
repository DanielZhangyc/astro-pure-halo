name: Policy

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  pull-request:
    name: PR policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch integration and stable branches
        run: git fetch --no-tags origin dev:refs/remotes/origin/dev main:refs/remotes/origin/main
      - name: Test release synchronization policy
        run: node --test scripts/verify-pr-policy.test.mjs
      - name: Validate branch and version policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTEGRATION_SHA: ${{ github.event.pull_request.base.ref == 'main' && 'origin/dev' || '' }}
          STABLE_SHA: origin/main
        run: node scripts/verify-pr-policy.mjs

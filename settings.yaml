apiVersion: v1alpha1
kind: Setting
metadata:
  name: astro-pure-halo-setting
spec:
  forms:
    - group: general
      label: 基础
      formSchema:
        - $formkit: attachment
          name: social_card
          label: 默认社交分享图片
          help: 页面没有独立封面时用于 Open Graph 和社交分享卡片；留空时不输出默认图片。
          accepts:
            - image/*
          value: ""
        - $formkit: text
          name: title_delimiter
          label: 页面标题分隔符
          help: 用于连接当前页面标题与 Halo 站点标题。
          value: "•"
        - $formkit: text
          name: og_locale
          label: Open Graph Locale
          help: 例如 en_US、zh_CN；留空时根据 Halo 站点语言自动生成。
          value: ""
        - $formkit: text
          name: date_locale
          label: 日期 Locale
          help: 浏览器 Intl 日期格式使用的 locale，例如 en-US、zh-CN。
          value: en-US
    - group: home
      label: 首页
      formSchema:
        - $formkit: url
          name: avatar
          label: 头像地址
          help: 留空时优先使用 Halo「设置 → 站点」中配置的 Logo；未配置站点 Logo 时使用 Pure 原版头像。
          value: ""
        - $formkit: text
          name: profile_name
          label: 显示名称
          help: 留空时使用 Halo 站点标题。
          value: ""
        - $formkit: text
          name: location
          label: 所在地
          help: 留空时不显示所在地。
          value: ""
        - $formkit: text
          name: source_label
          label: GitHub 链接文案
          help: 首页个人资料区的开发者 GitHub 链接文案。
          value: Source code
        - $formkit: url
          name: source_url
          label: GitHub 链接
          help: 首页个人资料区的开发者或源码地址；留空时不显示。
          value: ""
        - $formkit: text
          name: role
          label: About 简介
          help: 留空时使用 Halo 站点副标题。
          value: ""
        - $formkit: textarea
          name: about
          label: About 正文
          help: 留空时不显示额外正文。
          value: ""
        - $formkit: switch
          name: show_education
          label: 显示 Education
          help: 至少添加一项内容后再开启。
          value: false
        - $formkit: array
          name: education_items
          label: Education 内容
          addLabel: 添加 Education
          value: []
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.date
          children:
            - $formkit: text
              name: title
              label: 标题
              value: ""
            - $formkit: textarea
              name: description
              label: 描述
              value: ""
            - $formkit: text
              name: date
              label: 时间
              value: ""
            - $formkit: url
              name: url
              label: 链接
              value: ""
        - $formkit: switch
          name: show_websites
          label: 显示 Website List
          help: 至少添加一项内容后再开启。
          value: false
        - $formkit: array
          name: website_items
          label: Website List 内容
          addLabel: 添加网站
          value: []
          itemLabels:
            - type: image
              label: $value.image
            - type: text
              label: $value.title
          children:
            - $formkit: attachment
              name: image
              label: 图片
              accepts:
                - image/*
              aspectRatio: 16/9
              value: ""
            - $formkit: text
              name: title
              label: 标题
              value: ""
            - $formkit: text
              name: subtitle
              label: 副标题
              value: ""
            - $formkit: url
              name: url
              label: 链接
              value: ""
        - $formkit: switch
          name: show_certifications
          label: 显示 Certifications
          help: 至少添加一项内容后再开启。
          value: false
        - $formkit: array
          name: certification_items
          label: Certifications 内容
          addLabel: 添加 Certification
          value: []
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.date
          children:
            - $formkit: text
              name: title
              label: 标题
              value: ""
            - $formkit: textarea
              name: description
              label: 描述
              value: ""
            - $formkit: text
              name: date
              label: 时间
              value: ""
            - $formkit: url
              name: url
              label: 链接
              value: ""
        - $formkit: switch
          name: show_skills
          label: 显示 Skills
          help: 至少添加一组内容后再开启。
          value: false
        - $formkit: array
          name: skill_groups
          label: Skills 内容
          addLabel: 添加技能分组
          value: []
          itemLabels:
            - type: text
              label: $value.title
          children:
            - $formkit: text
              name: title
              label: 分组名称
              value: ""
            - $formkit: text
              name: skills
              label: 技能
              help: 多个技能使用英文逗号分隔。
              value: ""
        - $formkit: switch
          name: show_quote
          label: 显示底部随机名言
          help: 关闭后首页不显示随机名言，也不会请求随机名言接口。
          value: false
        - $formkit: url
          name: quote_server
          label: 随机名言接口
          help: 返回 JSON 的 HTTP(S) 接口；请求由访客浏览器直接发出，请同时完善站点隐私说明。
          value: ""
        - $formkit: text
          name: quote_field
          label: 名言字段路径
          help: 从接口 JSON 中读取文本的字段路径，例如 quote 或 data.content；不执行 JavaScript。
          value: quote
    - group: style
      label: 外观
      formSchema:
        - $formkit: select
          name: font_source
          label: 站点字体
          help: 默认使用主题内置的 IBM Plex Sans；自定义字体加载失败时自动回退到 IBM Plex Sans 和系统字体。
          value: ibm_plex
          options:
            - label: IBM Plex Sans（默认）
              value: ibm_plex
            - label: 自定义 WOFF2
              value: custom
            - label: 系统无衬线字体
              value: system
        - $formkit: attachment
          name: custom_font_regular
          label: 自定义字体 Regular（400）
          help: 选择“自定义 WOFF2”时必填。请只上传拥有网页托管和使用授权的 WOFF2 文件。
          accepts:
            - font/woff2
          value: ""
        - $formkit: attachment
          name: custom_font_italic
          label: 自定义字体 Italic（400，可选）
          help: 留空时由浏览器从 Regular 字体合成斜体。
          accepts:
            - font/woff2
          value: ""
        - $formkit: attachment
          name: custom_font_medium
          label: 自定义字体 Medium（500，可选）
          help: 留空时由浏览器使用 Regular 字体呈现中等字重。
          accepts:
            - font/woff2
          value: ""
        - $formkit: attachment
          name: custom_font_medium_italic
          label: 自定义字体 Medium Italic（500，可选）
          help: 留空时由浏览器使用其他已配置字形进行回退。
          accepts:
            - font/woff2
          value: ""
        - $formkit: color
          name: highlight_color
          label: 顶部高亮渐变
          value: "#659EB9"
    - group: header
      label: 导航
      formSchema:
        - $formkit: switch
          name: show_search
          label: 显示搜索按钮
          help: Halo 会自动提供 /search 路由，无需创建同名独立页面。
          value: true
    - group: content
      label: 内容
      formSchema:
        - $formkit: number
          name: blog_page_size
          label: Blog 每页文章数
          help: 用于 Pure Blog 自定义页面的服务端分页。
          min: 1
          max: 100
          value: 8
        - $formkit: checkbox
          name: share
          label: 文章分享按钮
          help: 选择文章版权卡片中显示的分享平台。
          value:
            - weibo
            - x
            - bluesky
          options:
            - label: 微博
              value: weibo
            - label: X
              value: x
            - label: Bluesky
              value: bluesky
        - $formkit: text
          name: external_link_content
          label: 外链标记
          help: 追加到正文绝对 HTTP(S) 链接后的提示；留空时仍在新窗口打开外链，但不追加文字。
          value: " ↗"
        - $formkit: switch
          name: image_caption
          label: 使用图片 Alt 作为说明
          help: 开启后，正文中带 Alt 文本的图片会显示居中的图片说明。
          value: false
        - $formkit: select
          name: blockquote_style
          label: 引用文字样式
          value: italic
          options:
            - label: 斜体
              value: italic
            - label: 正常
              value: normal
        - $formkit: select
          name: inline_code_style
          label: 行内代码样式
          value: modern
          options:
            - label: Modern（边框与背景）
              value: modern
            - label: Code（反引号）
              value: code
    - group: pages_links
      label: 友链页面
      formSchema:
        - $formkit: textarea
          name: apply_description
          label: Apply Links 申请说明
          help: 友链及分组请在“链接管理”插件中维护；本站信息自动读取 Halo 站点设置。
          value: |-
            可通过下方留言申请友链。申请前请先添加本站，并确保站点可以正常访问、具有正式域名、包含持续更新的原创内容，且内容不违反适用法律法规。
    - group: pages_terms
      label: 站点条款
      formSchema:
        - $formkit: text
          name: operator
          label: 站点运营者（可选）
          help: 个人博客可填写昵称或名称；留空时使用 Halo 站点标题。
          value: ""
        - $formkit: text
          name: contact
          label: 条款联系邮箱或联系方式（可选）
          help: 用于处理隐私权利请求、侵权通知等；留空时提示访客使用网站公开联系方式。
          value: ""
        - $formkit: date
          name: effective_date
          label: 生效日期（可选）
          help: 留空时页面显示当前日期。
          value: ""
        - $formkit: textarea
          name: additional_notice
          label: 补充说明（可选）
          help: 仅在站点有特殊服务、收费功能或额外数据处理方式时填写；普通博客通常无需配置。
          value: ""
    - group: post
      label: 文章
      formSchema:
        - $formkit: switch
          name: show_cover
          label: 显示文章封面
          value: true
        - $formkit: switch
          name: enable_toc
          label: 显示文章目录
          value: true
        - $formkit: text
          name: toc_title
          label: 目录标题
          value: TABLE OF CONTENTS
        - $formkit: select
          name: toc_style
          label: 目录高亮样式
          value: pure
          options:
            - label: Pure 原版（主色文字 + 连续圆角背景）
              value: pure
            - label: 仅主色文字
              value: text
            - label: 仅进度条
              value: progress
            - label: 静态目录
              value: plain
        - $formkit: switch
          name: toc_show_progress
          label: 显示左侧阅读进度条
          value: true
        - $formkit: switch
          name: toc_indent
          label: 缩进三级及更深标题
          value: true
        - $formkit: switch
          name: toc_compact
          label: 紧凑行距
          help: 关闭时使用 Pure 原版间距。
          value: false
        - $formkit: switch
          name: enable_comments
          label: 显示评论
          value: true
        - $formkit: switch
          name: show_navigation
          label: 显示上一篇/下一篇
          value: true
        - $formkit: switch
          name: enable_image_zoom
          label: 启用正文图片 Medium Zoom
          value: true
        - $formkit: text
          name: image_zoom_selector
          label: Medium Zoom 选择器
          help: Halo 正文图片默认使用 .prose img；可按需限制为带特定 class 的图片。
          value: .prose img
        - $formkit: text
          name: image_zoom_class
          label: Medium Zoom Class
          help: Medium Zoom 打开时附加的 className。
          value: zoomable
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: number
          name: start_year
          label: 版权起始年份
          help: 留空时只显示当前年份；填写早于当前年份的值时显示“起始年份 - 当前年份”。
          min: 1970
          max: 2100
          value:
        - $formkit: array
          name: links
          label: 其他页脚链接
          help: 位置 1 显示在版权行之前，位置 2 附加在版权名称之后。
          addLabel: 添加页脚链接
          value: []
          itemLabels:
            - type: text
              label: $value.title
          children:
            - $formkit: text
              name: title
              label: 文案
              validation: required
              value: ""
            - $formkit: text
              name: link
              label: 链接
              validation: required
              value: ""
            - $formkit: select
              name: position
              label: 位置
              value: 1
              options:
                - label: 版权行之前
                  value: 1
                - label: 版权名称之后
                  value: 2
            - $formkit: select
              name: style
              label: 文案样式
              value: ""
              options:
                - label: 默认
                  value: ""
                - label: 小号文字
                  value: text-sm
        - $formkit: array
          name: social
          label: 社交链接
          help: 配置后显示在页脚右侧；留空时继续使用下方 GitHub 与 RSS 兼容开关。
          addLabel: 添加社交链接
          value: []
          itemLabels:
            - type: text
              label: $value.label
          children:
            - $formkit: select
              name: icon
              label: 图标
              validation: required
              value: github
              options:
                - { label: GitHub, value: github }
                - { label: GitLab, value: gitlab }
                - { label: Discord, value: discord }
                - { label: YouTube, value: youtube }
                - { label: Instagram, value: instagram }
                - { label: X, value: x }
                - { label: Telegram, value: telegram }
                - { label: RSS, value: rss }
                - { label: Email, value: email }
                - { label: Reddit, value: reddit }
                - { label: Bluesky, value: bluesky }
                - { label: TikTok, value: tiktok }
                - { label: 微博, value: weibo }
                - { label: Steam, value: steam }
                - { label: 哔哩哔哩, value: bilibili }
                - { label: 知乎, value: zhihu }
                - { label: 酷安, value: coolapk }
                - { label: 网易云音乐, value: netease }
            - $formkit: text
              name: label
              label: 无障碍标签
              validation: required
              value: ""
            - $formkit: text
              name: href
              label: 链接
              help: "支持绝对地址、站内相对地址和 mailto: 邮箱链接。"
              validation: required
              value: ""
        - $formkit: text
          name: registration
          label: 备案信息
          help: 留空时不显示备案信息。
          value: ""
        - $formkit: url
          name: registration_url
          label: 备案信息链接
          value: ""
        - $formkit: text
          name: copyright
          label: 版权名称
          help: 留空时使用 Halo 站点标题。
          value: ""
        - $formkit: text
          name: policy_title
          label: 站点条款文案
          value: 站点条款
        - $formkit: url
          name: policy_url
          label: 站点条款链接
          value: /terms
        - $formkit: switch
          name: show_terms
          label: 显示站点条款
          value: true
        - $formkit: switch
          name: show_powered
          label: 显示 Halo & Pure theme powered
          value: true
        - $formkit: switch
          name: show_github
          label: 显示 GitHub 图标
          value: true
        - $formkit: switch
          name: show_rss
          label: 显示 RSS
          value: true

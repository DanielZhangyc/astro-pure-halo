apiVersion: v1alpha1
kind: Setting
metadata:
  name: astro-pure-halo-setting
spec:
  forms:
    - group: home
      label: 首页
      formSchema:
        - $formkit: url
          name: avatar
          label: 头像地址
          help: 留空时优先使用 Halo「设置 → 站点」中配置的 Logo；未配置站点 Logo 时使用 Pure 原版头像。
          value: ""
        - $formkit: text
          name: profile_name
          label: 显示名称
          value: Pure Lab
        - $formkit: text
          name: location
          label: 所在地
          value: Somewhere
        - $formkit: text
          name: source_label
          label: GitHub 链接文案
          help: 首页个人资料区的开发者 GitHub 链接文案。
          value: Source code
        - $formkit: url
          name: source_url
          label: GitHub 链接
          help: 首页个人资料区的开发者 GitHub 地址。
          value: https://github.com/cworld1/astro-theme-pure
        - $formkit: text
          name: role
          label: About 简介
          value: Developer / Designer
        - $formkit: textarea
          name: about
          label: About 正文
          value: Lorem ipsum dolor sit amet, vidit suscipit at mei. Quem denique mea id. Usu ei regione indoctum dissentiunt, cu meliore fuisset mei, vel quod voluptua ne. Ex dicat impedit mel, at eum oratio possit voluptatum.
        - $formkit: switch
          name: show_education
          label: 显示 Education
          value: true
        - $formkit: array
          name: education_items
          label: Education 内容
          addLabel: 添加 Education
          value:
            - title: Lorem ipsum
              description: Lorem ipsum dolor sit amet, vidit suscipit at mei.
              date: August 2021 - July 2025
              url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.date
          children:
            - $formkit: text
              name: title
              label: 标题
              value: ""
            - $formkit: textarea
              name: description
              label: 描述
              value: ""
            - $formkit: text
              name: date
              label: 时间
              value: ""
            - $formkit: url
              name: url
              label: 链接
              value: ""
        - $formkit: switch
          name: show_websites
          label: 显示 Website List
          value: true
        - $formkit: array
          name: website_items
          label: Website List 内容
          addLabel: 添加网站
          value:
            - image: /themes/astro-pure-halo/assets/pure/projects/1.avif
              title: Lorem ipsum
              subtitle: Do not go gentle into that good night
              url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
            - image: /themes/astro-pure-halo/assets/pure/projects/2.avif
              title: Lorem ipsum
              subtitle: Old age burn and rave at close of day
              url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
            - image: /themes/astro-pure-halo/assets/pure/projects/3.avif
              title: Lorem ipsum
              subtitle: Rage, rage against the dying of the light
              url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
            - image: /themes/astro-pure-halo/assets/pure/projects/4.avif
              title: More projects
              subtitle: Check out more projects
              url: /projects
          itemLabels:
            - type: image
              label: $value.image
            - type: text
              label: $value.title
          children:
            - $formkit: attachment
              name: image
              label: 图片
              accepts:
                - image/*
              aspectRatio: 16/9
              value: ""
            - $formkit: text
              name: title
              label: 标题
              value: ""
            - $formkit: text
              name: subtitle
              label: 副标题
              value: ""
            - $formkit: url
              name: url
              label: 链接
              value: ""
        - $formkit: switch
          name: show_certifications
          label: 显示 Certifications
          value: true
        - $formkit: array
          name: certification_items
          label: Certifications 内容
          addLabel: 添加 Certification
          value:
            - title: Lorem ipsum
              description: Lorem ipsum dolor sit amet, vidit suscipit at mei. Quem denique mea id. Usu ei regione indoctum dissentiunt, cu meliore fuisset mei, vel quod voluptua ne. Ex dicat impedit mel, at eum oratio possit voluptatum. Dicat ceteros cu vim. Impetus fuisset ullamcorper pri cu, his posse iisque ad, aliquam honestatis usu id.
              date: July 2024
              url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
          itemLabels:
            - type: text
              label: $value.title
            - type: text
              label: $value.date
          children:
            - $formkit: text
              name: title
              label: 标题
              value: ""
            - $formkit: textarea
              name: description
              label: 描述
              value: ""
            - $formkit: text
              name: date
              label: 时间
              value: ""
            - $formkit: url
              name: url
              label: 链接
              value: ""
        - $formkit: switch
          name: show_skills
          label: 显示 Skills
          value: true
        - $formkit: array
          name: skill_groups
          label: Skills 内容
          addLabel: 添加技能分组
          value:
            - title: Languages
              skills: Html, JavaScript, CSS, Shell
            - title: Frontend
              skills: TypeScript, Vite, Webpack, Astro
            - title: Backend
              skills: Vercel, Waline
          itemLabels:
            - type: text
              label: $value.title
          children:
            - $formkit: text
              name: title
              label: 分组名称
              value: ""
            - $formkit: text
              name: skills
              label: 技能
              help: 多个技能使用英文逗号分隔。
              value: ""
        - $formkit: switch
          name: show_quote
          label: 显示底部随机名言
          help: 关闭后首页不显示随机名言，也不会请求随机名言接口。
          value: true
    - group: style
      label: 外观
      formSchema:
        - $formkit: color
          name: highlight_color
          label: 顶部高亮渐变
          value: "#659EB9"
    - group: header
      label: 导航
      formSchema:
        - $formkit: switch
          name: show_search
          label: 显示搜索按钮
          help: Halo 会自动提供 /search 路由，无需创建同名独立页面。
          value: true
    - group: pages_links
      label: 友链页面
      formSchema:
        - $formkit: array
          name: common_friends
          label: Common Links
          help: 普通友链。三个友链列表使用相同字段；头像留空时自动获取站点 favicon。
          addLabel: 添加 Common Link
          value:
            - name: xy0v0's Blog
              intro: xy0v0's Blog
              link: https://www.xy0v0.top/
              avatar: ""
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: text
              name: name
              label: 站点名称
              validation: required
              value: ""
            - $formkit: text
              name: intro
              label: 一句话简介
              value: ""
            - $formkit: url
              name: link
              label: 站点地址
              validation: required
              value: ""
            - $formkit: attachment
              name: avatar
              label: 站点头像或 Logo（可选）
              help: 留空时自动获取站点 favicon。
              accepts:
                - image/*
              value: ""
        - $formkit: array
          name: bad_friends
          label: Links with Bad Status
          help: 暂时无法访问、长期未更新或状态异常的友链；页面中保持 Pure 原版折叠展示。
          addLabel: 添加 Bad Status Link
          value: []
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: text
              name: name
              label: 站点名称
              validation: required
              value: ""
            - $formkit: text
              name: intro
              label: 一句话简介
              value: ""
            - $formkit: url
              name: link
              label: 站点地址
              validation: required
              value: ""
            - $formkit: attachment
              name: avatar
              label: 站点头像或 Logo（可选）
              help: 留空时自动获取站点 favicon。
              accepts:
                - image/*
              value: ""
        - $formkit: array
          name: special_friends
          label: Special Links
          help: 框架、主题或其他特别推荐的站点。
          addLabel: 添加 Special Link
          value:
            - name: Halo
              intro: 强大易用的开源建站工具
              link: https://www.halo.run/
              avatar: ""
            - name: Astro
              intro: The web framework for content-driven websites
              link: https://astro.build/
              avatar: ""
            - name: Pure
              intro: A simple, fast and powerful Astro theme
              link: https://github.com/cworld1/astro-theme-pure
              avatar: ""
          itemLabels:
            - type: text
              label: $value.name
          children:
            - $formkit: text
              name: name
              label: 站点名称
              validation: required
              value: ""
            - $formkit: text
              name: intro
              label: 一句话简介
              value: ""
            - $formkit: url
              name: link
              label: 站点地址
              validation: required
              value: ""
            - $formkit: attachment
              name: avatar
              label: 站点头像或 Logo（可选）
              help: 留空时自动获取站点 favicon。
              accepts:
                - image/*
              value: ""
        - $formkit: array
          name: history
          label: Link History Book
          help: 记录友链新增、迁移、失效或恢复等变化，页面中保持 Pure 原版折叠时间轴。
          addLabel: 添加历史记录
          value: []
          itemLabels:
            - { type: text, label: $value.date }
            - { type: text, label: $value.content }
          children:
            - $formkit: text
              name: date
              label: 日期
              validation: required
              value: ""
            - $formkit: textarea
              name: content
              label: 内容
              validation: required
              value: ""
        - $formkit: textarea
          name: apply_description
          label: Apply Links 申请说明
          help: 本站名称、简介、地址和头像自动读取 Halo 站点信息，无需在此重复填写。
          value: |-
            可通过下方留言申请友链。申请前请先添加本站，并确保站点可以正常访问、具有正式域名、包含持续更新的原创内容，且内容不违反适用法律法规。
    - group: pages_terms
      label: 站点条款
      formSchema:
        - $formkit: text
          name: operator
          label: 站点运营者（可选）
          help: 个人博客可填写昵称或名称；留空时使用 Halo 站点标题。
          value: ""
        - $formkit: text
          name: contact
          label: 条款联系邮箱或联系方式（可选）
          help: 用于处理隐私权利请求、侵权通知等；留空时提示访客使用网站公开联系方式。
          value: ""
        - $formkit: date
          name: effective_date
          label: 生效日期（可选）
          help: 留空时页面显示当前日期。
          value: ""
        - $formkit: textarea
          name: additional_notice
          label: 补充说明（可选）
          help: 仅在站点有特殊服务、收费功能或额外数据处理方式时填写；普通博客通常无需配置。
          value: ""
    - group: post
      label: 文章
      formSchema:
        - $formkit: switch
          name: show_cover
          label: 显示文章封面
          value: true
        - $formkit: switch
          name: enable_toc
          label: 显示文章目录
          value: true
        - $formkit: text
          name: toc_title
          label: 目录标题
          value: TABLE OF CONTENTS
        - $formkit: select
          name: toc_style
          label: 目录高亮样式
          value: pure
          options:
            - label: Pure 原版（主色文字 + 连续圆角背景）
              value: pure
            - label: 仅主色文字
              value: text
            - label: 仅进度条
              value: progress
            - label: 静态目录
              value: plain
        - $formkit: switch
          name: toc_show_progress
          label: 显示左侧阅读进度条
          value: true
        - $formkit: switch
          name: toc_indent
          label: 缩进三级及更深标题
          value: true
        - $formkit: switch
          name: toc_compact
          label: 紧凑行距
          help: 关闭时使用 Pure 原版间距。
          value: false
        - $formkit: switch
          name: enable_comments
          label: 显示评论
          value: true
        - $formkit: switch
          name: show_navigation
          label: 显示上一篇/下一篇
          value: true
        - $formkit: switch
          name: enable_image_zoom
          label: 启用正文图片 Medium Zoom
          value: true
    - group: footer
      label: 页脚
      formSchema:
        - $formkit: text
          name: registration
          label: 备案信息
          help: 留空时不显示备案信息。
          value: ""
        - $formkit: url
          name: registration_url
          label: 备案信息链接
          value: ""
        - $formkit: text
          name: copyright
          label: 版权名称
          value: Pure Lab
        - $formkit: text
          name: policy_title
          label: 站点条款文案
          value: 站点条款
        - $formkit: url
          name: policy_url
          label: 站点条款链接
          value: /terms
        - $formkit: switch
          name: show_terms
          label: 显示站点条款
          value: true
        - $formkit: switch
          name: show_powered
          label: 显示 Halo & Pure theme powered
          value: true
        - $formkit: switch
          name: show_github
          label: 显示 GitHub 图标
          value: true
        - $formkit: switch
          name: show_rss
          label: 显示 RSS
          value: true

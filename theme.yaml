apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: astro-pure-halo
spec:
  displayName: Astro Pure
  author:
    name: Daniel Zhang
    website: https://github.com/DanielZhangyc
  description: A clean, fast and content-focused Halo theme ported from Astro Theme Pure.
  logo: /themes/astro-pure-halo/assets/pure/theme-logo.png
  homepage: https://github.com/DanielZhangyc/astro-pure-halo
  repo: https://github.com/DanielZhangyc/astro-pure-halo.git
  issues: https://github.com/DanielZhangyc/astro-pure-halo/issues
  settingName: astro-pure-halo-setting
  configMapName: astro-pure-halo-config
  customTemplates:
    page:
      - name: Pure Blog
        description: 延续 Astro Theme Pure 信息层级与交互的文章列表。
        screenshot:
        file: blog.html
      - name: Pure 站点条款
        description: 集中展示服务条款、隐私说明、版权和免责声明。
        screenshot:
        file: terms.html
    category:
      - name: Pure Blog Category
        description: 延续 Astro Theme Pure 信息层级与交互的分类文章列表。
        screenshot:
        file: category-blog.html
  version: "0.2.0"
  requires: ">=2.25.0"
  license:
    - name: "Apache-2.0"
      url: "https://github.com/DanielZhangyc/astro-pure-halo/blob/main/LICENSE"
